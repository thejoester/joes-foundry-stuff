name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    uses: thejoester/foundry-release-action/.github/workflows/release.yml@v1
    with:
      module-id: joes-foundry-stuff
      build-packs: true
      pack-verify-cmd: node _build/verify-extracted-packs.mjs
      changelog: true  # headings are SemVer-valid (leading-zero-free dates); release tag must match a heading exactly
